name: 每日早上提醒

on:
  schedule:
    - cron: '7 0 * * *'   # UTC 00:07 = 马来西亚时间每天早上 8:07
  workflow_dispatch:       # 可以在 Actions 页面手动按「Run workflow」测试

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 发送 Telegram 提醒
        run: node scripts/daily-reminder.mjs
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
